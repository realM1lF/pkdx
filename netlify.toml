# Netlify build config — MyPokePanion (Vite SPA)
[build]
  # Playwright (devDependency) + Chromium installieren, damit der postbuild-
  # Prerender-Schritt (scripts/prerender.mjs) auch im Netlify-Build läuft.
  # Install dauert ~2-4 min; schlägt sie fehl, skippt prerender.mjs nur mit
  # Warnung — PRERENDER=required macht den Build stattdessen hart fehl.
  # Kein --with-deps: Netlify erlaubt kein root/su im Build-Image.
  # Die Build-Image-Basis enthaelt die noetigen Chromium-Libs bereits.
  command = "npx playwright install chromium && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  PRERENDER = "required"
  # Belt & braces: oeffentliche Registry erzwingen (Lockfile-URLs werden
  # zusaetzlich per scripts/fix-lockfile-registry.mjs normalisiert).
  NPM_CONFIG_REGISTRY = "https://registry.npmjs.org/"

# --- Root language redirect -----------------------------------------------
# '/' is the strongest URL of the domain but only a SPA shell — redirect it
# server-side by Accept-Language (302, because the target is language
# dependent). force = true is required: static files beat unforced redirect
# rules, and dist/index.html exists. The client-side LangGate redirect stays
# as fallback for non-Netlify serving. Trailing-slash behavior is untouched
# (Netlify's CDN already 301-normalizes /x → /x/; rules cannot change that).
[[redirects]]
  from = "/"
  to = "/de/"
  status = 302
  force = true
  conditions = { Language = ["de"] }

[[redirects]]
  from = "/"
  to = "/en/"
  status = 302
  force = true

# ORDER MATTERS — do not move the "/*" block back below the specific ones.
#
# Netlify merges the headers of every matching rule, but when two rules set
# the SAME header, the one declared LAST wins. With "/*" at the bottom its
# Cache-Control overrode the immutable values above it, and /assets, /sprites
# and /fonts were served with max-age=0 (verified against production). The
# catch-all therefore has to come first: it supplies the security headers to
# every response, and the specific rules below only override Cache-Control.
#
# Cache strategy (fixes "MIME type text/html" chunk errors after deploys):
# hashed assets are immutable, everything else (esp. index.html) must
# revalidate so browsers never reference deleted chunk hashes. Note that
# /vendor/* is deliberately NOT immutable — pkmn-sim.mjs has no hash in its
# filename, so it must revalidate to pick up a rebuild.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

    # --- Security headers ---------------------------------------------------
    # HSTS: two years + subdomains, preload-eligible.
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    # Stop MIME sniffing (also hardens the "chunk served as text/html" case).
    X-Content-Type-Options = "nosniff"
    # No framing anywhere — mirrored by frame-ancestors for modern browsers.
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=(), payment=(), usb=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-site"

    # CSP — every source below is actually used; verified against the built
    # bundle (see the source map of allowances):
    #   script      self (app chunks + /plausible-init.js) + plausible.io tracker
    #   style       'unsafe-inline' is REQUIRED: framer-motion/GSAP animate via
    #               inline style attributes on almost every element
    #   img         raw.githubusercontent.com = PokeAPI/sprites fallback chain
    #               (src/lib/sprites.ts); data:/blob: for generated canvases
    #   media       raw.githubusercontent.com = PokeAPI/cries .ogg (HeroPanel)
    #   connect     pokeapi.co, data.pkmn.cc (Smogon sets), Supabase REST +
    #               Realtime websocket, plausible event endpoint.
    #               pkmn.github.io is required too: data.pkmn.cc answers with a
    #               301 there and CSP validates the redirect target, not just
    #               the initial host (verified via scripts/check-csp.mjs).
    #   worker/blob CompressionStream + lazy @pkmn/sim vendor bundle
    # NOTE: if VITE_SUPABASE_URL is ever pointed at another project, its host
    # must be added to connect-src or all multiplayer calls will be blocked.
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://plausible.io; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://raw.githubusercontent.com; media-src 'self' https://raw.githubusercontent.com; font-src 'self'; connect-src 'self' https://pokeapi.co https://raw.githubusercontent.com https://data.pkmn.cc https://pkmn.github.io https://plausible.io https://iqsdojzyqznmcirypdnk.supabase.co wss://iqsdojzyqznmcirypdnk.supabase.co; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; frame-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests"

# --- Cache-Control overrides (must stay AFTER the catch-all, see note above)
# Content-addressed or immutable-by-nature files only.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sprites/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
