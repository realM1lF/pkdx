<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Tab mark: same ball as logo.svg, filled and thickened so 16px still reads. -->
  <circle cx="16" cy="16" r="16" fill="#05060A"/>
  <clipPath id="ball">
    <circle cx="16" cy="16" r="14.5"/>
  </clipPath>
  <g clip-path="url(#ball)">
    <rect width="32" height="16" fill="#F6C945"/>
    <rect y="16" width="32" height="16" fill="#F4F6FC"/>
    <rect y="12.5" width="32" height="7" fill="#05060A"/>
  </g>
  <circle cx="16" cy="16" r="14.5" fill="none" stroke="#05060A" stroke-width="1"/>
  <circle cx="16" cy="16" r="5.6" fill="#05060A"/>
  <circle cx="16" cy="16" r="3.1" fill="#F6C945"/>
</svg>
