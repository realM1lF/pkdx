    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-48.png" type="image/png" sizes="48x48" />
    <link rel="icon" href="/favicon-192.png" type="image/png" sizes="192x192" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />

    <link rel="preload" href="/fonts/orbitron/orbitron-900.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/space-grotesk/space-grotesk-400.woff2" as="font" type="font/woff2" crossorigin />

    <meta property="og:title" content="MyPokePanion — Every Pokémon. Alive." />
    <meta property="og:description" content="A living, breathing Pokédex: 1,025 Pokémon, 18 types, 9 generations, and a museum of every sprite era." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mypokepanion.com/" />
    <!-- Root '/' is the language-redirect landing (Netlify 302s by
         Accept-Language, LangGate redirects client-side as fallback). The
         static canonical/hreflang cluster below makes '/' crawlable without
         JS; SeoHead updates these tags in place once the SPA routes. The
         canonical URL form site-wide is trailing slash ('/' inherently). -->
    <link rel="canonical" href="https://mypokepanion.com/" />
    <link rel="alternate" hreflang="de" href="https://mypokepanion.com/de/" />
    <link rel="alternate" hreflang="en" href="https://mypokepanion.com/en/" />
    <link rel="alternate" hreflang="x-default" href="https://mypokepanion.com/" />
    <meta property="og:image" content="/og-cover.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Dismissed notice flag before first paint. External so CSP needs no
         'unsafe-inline' (same pattern as zoom-init.js). -->
    <script src="/announce-init.js"></script>
    <script src="/zoom-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
