name: 🐛 Bug Report
description: Report a bug on MyPokePanion
title: "[Bug] "
labels: ["bug"]
body:
  - type: input
    id: page
    attributes:
      label: Page / URL
      description: Where did the bug happen? (e.g. /de/versus, Teambuilder, Nuzlocke)
      placeholder: /de/versus
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe the bug — what did you expect instead?
      placeholder: I clicked … and expected …, but …
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open …\n2. Click …\n3. See error"
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome / Edge
        - Firefox
        - Safari
        - Mobile browser
        - Other
  - type: textarea
    id: extra
    attributes:
      label: Screenshots / console errors
      description: Optional — paste screenshots or red console messages (F12)
